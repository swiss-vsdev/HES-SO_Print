[project]
name = "papercut-app"
version = "1.0.0"
description = "HES-SO PaperCut Print Client (package)"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.15",
    "keyring>=25.0",
    "pypdf>=3.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]